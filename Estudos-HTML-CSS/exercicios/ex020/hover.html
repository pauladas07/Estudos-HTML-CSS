<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
          body {
                font-family: Georgia, 'Times New Roman', Times, serif;
          }
          h1 {
              text-align: center;
          }
          div > p {
                   display:  none;
          }
          div:hover > p {
                         display: block;
                         color: blue;
                         background-color: aqua;
                         width: 250px;
          }
          div:hover {
                     color: blueviolet;
          }
    </style>
</head>
<body>
    <h1>Exemplo de Hover </h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
        Passe o mouse aqui
        <p>TEXTO ESCONDIDO...</p>
    </div>
</body>
</html>
